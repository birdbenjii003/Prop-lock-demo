name: Validate Scenarios opportunity and weather research
on:
  push:
    paths:
      - 'index.html'
      - 'scripts/scenarios-v2.js'
      - 'tests/scenarios-v2.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenario-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scenario source syntax
        run: node --check scripts/scenarios-v2.js
      - name: Run scenario research safeguards
        run: node tests/scenarios-v2.test.cjs
      - name: Verify browser main script still parses
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const inline=html.match(/<script>\s*([\s\S]*?)<\/script>/);
          if(!inline)throw Error('Missing main inline script');
          new vm.Script(inline[1]);
          console.log('Main script parses');
          NODE
