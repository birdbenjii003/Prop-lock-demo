name: Live Data Foundation v2 browser acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-data-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tooling
        run: |
          npm init -y
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate foundation and browser suite
        run: |
          node --check scripts/live-data-foundation.js
          node --check tests/live-data-v2-browser-e2e.cjs
          node tests/live-data-foundation.test.cjs
      - name: Exercise deployed schedule and freshness behavior
        run: node tests/live-data-v2-browser-e2e.cjs
        env:
          LIVE_DATA_URL: https://birdbenjii003.github.io/Prop-lock-demo/
      - name: Save screenshots and assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-data-v2-browser-evidence
          path: test-results/
          if-no-files-found: ignore
