name: Deep Dive Stage 4 browser acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show environment and initialize isolated test package
        run: |
          node --version
          npm --version
          npm init -y
      - name: Install Playwright JavaScript package
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify package resolves
        run: node -e "console.log('Playwright version', require('playwright/package.json').version)"
      - name: Install Chromium browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify Chromium launches before running site tests
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          chromium.launch({headless:true}).then(async browser => {
            console.log('BROWSER_LAUNCH_OK',browser.version());
            await browser.close();
          }).catch(error=>{console.error('BROWSER_LAUNCH_FAILED',error);process.exitCode=1});
          NODE
      - name: Run mobile browser acceptance against deployed Pages
        run: node tests/deep-dive-browser-e2e.cjs
        env:
          DEEP_DIVE_URL: https://birdbenjii003.github.io/Prop-lock-demo/
      - name: Save browser evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-dive-browser-acceptance
          path: test-results/
          if-no-files-found: ignore
