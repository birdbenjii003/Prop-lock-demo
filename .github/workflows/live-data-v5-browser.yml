name: Live Data v5 published snapshot browser acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm init -y
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual deployed snapshot and controlled failure cases
        run: node tests/live-data-v5-publication-browser.cjs
      - name: Save browser acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-data-v5-publication-evidence
          path: test-results/
          if-no-files-found: ignore
