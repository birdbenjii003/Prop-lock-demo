name: Verify free NFL snap identities
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deep-dive-snap-ids
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build one-to-one GSIS/PFR crosswalk and verify player-week stats
        run: python scripts/verify_nfl_snap_ids.py
      - name: Confirm validated participation output exists
        run: |
          test -s data/nfl_verified_snaps_2023_2025.csv
          test $(wc -l < data/nfl_verified_snaps_2023_2025.csv) -ge 501
      - name: Commit verified snap evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nfl_verified_snaps_2023_2025.csv
          if git diff --cached --quiet; then echo 'Verified snap evidence unchanged.'; else
            git commit -m 'Publish GSIS-verified historical NFL snap evidence'
            git push
          fi
