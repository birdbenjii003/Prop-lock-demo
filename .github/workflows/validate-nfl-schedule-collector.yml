name: Validate NFL published schedule collector
on:
  push:
    paths:
      - 'scripts/collect-nfl-schedule.py'
      - 'tests/test_nfl_schedule_collector.py'
      - '.github/workflows/collect-nfl-schedule.yml'
      - '.github/workflows/validate-nfl-schedule-collector.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline fixtures without provider requests
        run: python -m unittest discover -s tests -p test_nfl_schedule_collector.py -v
      - name: Verify browser main script parses
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const inline=html.match(/<script>\s*([\s\S]*?)<\/script>/);
          if(!inline)throw Error('Main script missing');
          new vm.Script(inline[1]);
          if(!html.includes('loadPublishedNflSchedule()'))throw Error('Published snapshot UI not wired');
          console.log('Schedule monitor script syntax PASS');
          NODE
