name: Validate Deep Dive research
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'scripts/deep-dive-v2.js'
      - 'scripts/deep-dive-workspace.js'
      - 'scripts/deep-dive-views.js'
      - 'tests/deep-dive.test.cjs'
      - 'tests/test_deep_dive_calibration.py'
      - 'scripts/deep-dive-calibration.py'
      - 'scripts/deep-dive-independent-checks.py'
      - 'tests/test_deep_dive_independent_checks.py'
      - 'scripts/verify_nfl_snap_ids.py'
      - 'tests/test_verified_snap_ids.py'
      - 'scripts/deep-dive-snaps.js'
      - 'tests/deep-dive-snaps.test.cjs'
      - 'scripts/deep-dive-quality.js'
      - 'tests/deep-dive-quality.test.cjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline Deep Dive fixture tests
        run: node tests/deep-dive.test.cjs
      - name: Verify snap identity join safeguards
        run: node tests/deep-dive-snaps.test.cjs
      - name: Validate PBP opportunity quality guardrails
        run: node tests/deep-dive-quality.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check chronological calibration audit
        run: python -m unittest discover -s tests -p 'test_*.py'
