name: Collect NFL rosters — reusable manual batch v8
on:
  workflow_dispatch:
    inputs:
      group:
        description: Starting roster group (choose 1, 4 or 7 for 3-run coverage of all remaining teams)
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
          - '9'
      groups:
        description: Number of consecutive groups (1–3); three groups mean at most nine team requests
        required: true
        type: choice
        default: '3'
        options:
          - '1'
          - '2'
          - '3'
permissions:
  contents: write
concurrency:
  group: prop-lock-nfl-roster-index-publish
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate roster safety, request caps and cache behavior offline
        run: |
          python -m unittest discover -s tests -p test_nfl_roster_index.py -v
          python -m unittest discover -s tests -p test_nfl_roster_v8.py -v
          python -m unittest discover -s tests -p test_nfl_roster_v8_multi.py -v
      - name: Collect at most nine team rosters from up to three adjacent groups
        run: python scripts/collect-nfl-roster-v8-multi.py --start-group "${{ inputs.group }}" --groups "${{ inputs.groups }}"
      - name: Rebuild full 32-team coverage and conflict index
        run: python scripts/build-nfl-roster-index.py --all-teams
      - name: Publish validated snapshots and global index only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report=json.loads(Path('test-results/nfl-roster-v8-multi-report.json').read_text())
          for row in report['results']:
              if row['status']=='PUBLISHED':
                  team=row['team']
                  assert team in report['selectedTeams'] and team.isalpha() and 2<=len(team)<=3
                  path=Path('data/live')/f'nfl_roster_{team}.json'
                  assert path.is_file()
                  subprocess.check_call(['git','add','--',str(path)])
          PY
          if [[ -f data/live/nfl_roster_cooldown.json ]]; then
            git add -- data/live/nfl_roster_cooldown.json
          fi
          git add -- data/live/nfl_roster_index.json
          if git diff --cached --quiet; then
            echo "No modified validated snapshots."
          else
            git commit -m "data: refresh selected NFL roster batch and global index"
            git push origin HEAD:main
          fi
      - name: Surface source failures after preserving good data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('test-results/nfl-roster-v8-multi-report.json').read_text())
          index=json.loads(Path('data/live/nfl_roster_index.json').read_text())
          print('Coverage:',index['coverage'])
          for row in report['results']:
              print(row['team'],row['status'],row.get('reason',''))
          if not report['allSuccessful']:
              raise SystemExit('Partial or rate-limited batch; already validated snapshots and cooldown retained')
          PY
      - name: Upload per-team report and coverage for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-roster-v8-batch-evidence
          path: |
            test-results/nfl-roster-v8-multi-report.json
            data/live/nfl_roster_index.json
            data/live/nfl_roster_cooldown.json
          if-no-files-found: ignore
