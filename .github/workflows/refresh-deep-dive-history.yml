name: Refresh free Deep Dive NFL history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deep-dive-history-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build 2023-2025 historical player archive
        run: python scripts/update_nfl_history.py
      - name: Run cross-season Deep Dive audit (only with complete seasons)
        run: python scripts/deep-dive-calibration.py
      - name: Verify nonempty restored archive
        run: |
          test -s data/nfl_history_2023_2025.csv
          python -m unittest discover -s tests -p 'test_deep_dive_*.py'
      - name: Reproduce Stage 3 validation from restored NFL sources
        run: python scripts/deep-dive-stage3-verification.py
      - name: Compare asymmetric NFL ranges without promoting the model
        run: python scripts/deep-dive-asymmetric-audit.py
      - name: Commit verified archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nfl_history_2023_2025.csv
          if [ -f data/reports/deep_dive_calibration_audit.json ]; then
            git add data/reports/deep_dive_calibration_audit.json
          fi
          if [ -s data/reports/deep_dive_stage3_verification.json ]; then
            git add data/reports/deep_dive_stage3_verification.json
          fi
          if [ -s data/reports/deep_dive_asymmetric_range_audit.json ]; then
            git add data/reports/deep_dive_asymmetric_range_audit.json
          fi
          if git diff --cached --quiet; then
            echo 'No changes to historical archive.'
          else
            git commit -m 'Refresh historical free NFL player records'
            git push
          fi
