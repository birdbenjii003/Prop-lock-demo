name: Scenarios Phase 2 browser acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize test dependencies
        run: |
          npm init -y
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install supported Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify browser can launch
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          chromium.launch().then(async b=>{console.log('Chromium launch OK',b.version());await b.close();})
            .catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Run Scenarios real mobile browser tests
        run: node tests/scenarios-browser-e2e.cjs
        env:
          SCENARIOS_URL: https://birdbenjii003.github.io/Prop-lock-demo/
      - name: Upload debugging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-browser-evidence
          path: test-results/
          if-no-files-found: ignore
