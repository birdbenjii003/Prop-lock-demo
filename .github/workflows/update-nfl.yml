name: Update free NFL weekly stats
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: write
concurrency:
  group: public-nfl-snapshot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate nflverse 2026 stats
        run: python scripts/update_nfl.py
      - name: Commit updated static dataset, if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nfl_2026.csv
          if git diff --cached --quiet; then
            echo 'No new NFL statistics available.'
          else
            git commit -m 'Refresh public NFL 2026 weekly statistics'
            git push
          fi
