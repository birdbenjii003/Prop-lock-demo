name: Scenarios Phase 4 roster identity browser acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roster-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium browser tooling
        run: |
          npm init -y
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check roster and browser test syntax
        run: |
          node --check scripts/scenarios-roster-identity.js
          node --check tests/scenarios-phase4-roster-browser-e2e.cjs
          node tests/scenarios-roster-identity.test.cjs
      - name: Exercise deployed roster panel with controlled identity evidence
        run: node tests/scenarios-phase4-roster-browser-e2e.cjs
        env:
          SCENARIOS_URL: https://birdbenjii003.github.io/Prop-lock-demo/
      - name: Save browser logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-phase4-roster-evidence
          path: test-results/
          if-no-files-found: ignore
