name: Verify deployed Deep Dive GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check live GitHub Pages assets and hosted NFL evidence
        run: python scripts/deep-dive-live-smoke.py
